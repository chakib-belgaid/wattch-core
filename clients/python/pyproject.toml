[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pywattch"
version = "0.1.0"
description = "Wattch energy measurement client: pyJoules-style API backed by a Wattch daemon socket"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Mohammed Chakib Belgaid" }]
keywords = ["energy", "rapl", "power", "profiling", "wattch"]

[project.optional-dependencies]
profiler = ["pyinstrument>=4.6"]
dev = ["pytest>=8", "pyinstrument>=4.6"]

[tool.setuptools.packages.find]
include = ["pywattch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
