[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pywattch"
version = "0.1.0"
description = "Wattch energy measurement client: pyJoules-style API backed by a Wattch daemon socket"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Mohammed Chakib Belgaid" }]
keywords = ["energy", "rapl", "power", "profiling", "wattch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX",
  "Topic :: System :: Monitoring",
]

[project.urls]
Repository = "https://github.com/chakib-belgaid/wattch-core"

[project.scripts]
wattch-energytest = "pywattch.energytest.__main__:main"

[project.optional-dependencies]
analysis = ["pyarrow>=15"]
profiler = ["pyinstrument>=4.6"]
dev = ["pytest>=8", "pyinstrument>=4.6"]

[tool.setuptools.packages.find]
include = ["pywattch*"]

[tool.setuptools.package-data]
pywattch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
