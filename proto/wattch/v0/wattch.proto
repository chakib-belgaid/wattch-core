syntax = "proto3";

package wattch.v0;

// Wattch protocol v0.
// Control-plane messages are allowed to be descriptive.
// Data-plane messages must remain compact and avoid repeated strings.

enum EvidenceClass {
  EVIDENCE_CLASS_UNSPECIFIED = 0;
  RAW_HARDWARE_COUNTER = 1;
  RAW_SENSOR_READING = 2;
  OS_TELEMETRY = 3;
  TOOL_DERIVED_ESTIMATE = 4;
  MODEL_DERIVED_ESTIMATE = 5;
  BENCHMARK_MARKER = 6;
}

enum Temporality {
  TEMPORALITY_UNSPECIFIED = 0;
  CUMULATIVE = 1;
  INSTANT = 2;
  DELTA = 3;
  GAUGE = 4;
  EVENT = 5;
  // Average over a raw, descriptor-linked duration interval. The descriptor
  // declares its daemon-clock anchor; compact RawSample remains unchanged.
  INTERVAL_AVERAGE = 6;
}

enum Unit {
  UNIT_UNSPECIFIED = 0;
  JOULE = 1;
  WATT = 2;
  MICROJOULE = 3;
  NANOSECOND = 4;
  PERCENT = 5;
  COUNTER = 6;
  HERTZ = 7;
  CELSIUS = 8;
  BYTE = 9;
  MILLIWATT = 10;
}

enum SamplingMode {
  SAMPLING_MODE_UNSPECIFIED = 0;
  PERIODIC = 1;
  // The implemented JSON value is "EVENT". Protobuf enum values share package
  // scope, so this symbol is prefixed to avoid colliding with Temporality.EVENT.
  SAMPLING_MODE_EVENT = 2;
  POLLED = 3;
  IMPORTED = 4;
  SYNTHETIC = 5;
}

message SourceDescriptor {
  // Local numeric id used by RawSample. Valid only inside this daemon/run.
  uint32 local_source_id = 1;

  // Stable logical identity of the source.
  string source_uid = 2;

  // Node identity. Local-only runs can use "local".
  string node_id = 3;

  // Backend name: deterministic, rapl, nvml, powermetrics, external, os, etc.
  string backend = 4;

  // Semantic kind: cpu_package_energy, gpu_power, c_state_residency, wakeups, etc.
  string kind = 5;

  Unit unit = 6;
  Temporality temporality = 7;
  EvidenceClass evidence_class = 8;

  // Hierarchical path: cpu/package/0/energy, cpu/package/0/core/0/energy, gpu/0/power.
  string source_path = 9;

  // Parent source uid for nested topologies.
  optional string parent_source_uid = 10;

  string clock_domain = 11;
  SamplingMode sampling_mode = 12;
  optional uint64 nominal_period_ns = 13;
  optional double max_value = 14;
  optional double resolution = 15;

  map<string, string> labels = 16;
}

message RawSample {
  uint32 source_id = 1;
  uint64 sequence_no = 2;
  uint64 monotonic_ns = 3;

  oneof value {
    double f64 = 4;
    sint64 i64 = 5;
    bytes raw = 6;
  }
}

message RawSampleBatch {
  // Must equal the run id acknowledged for the active capture. Implemented
  // v0.1 transports bound this field to 256 UTF-8 bytes.
  string run_id = 1;
  // Must equal HelloResponse.node_id for this connection.
  string node_id = 2;
  // Must move forward within a connection; replay/reordering is invalid.
  uint64 batch_sequence_no = 3;
  // At most one sample per advertised source in each batch.
  repeated RawSample samples = 4;
}

message Event {
  string event_id = 1;
  string run_id = 2;
  string node_id = 3;
  uint64 monotonic_ns = 4;
  string kind = 5;
  map<string, string> labels = 6;
}

message EventBatch {
  string run_id = 1;
  string node_id = 2;
  uint64 batch_sequence_no = 3;
  repeated Event events = 4;
}

message HelloRequest {
  string client_name = 1;
  string client_version = 2;
  // Implemented JSON transports negotiate one exact major/minor version.
  string protocol_version = 3;
}

message HelloResponse {
  string daemon_name = 1;
  string daemon_version = 2;
  string protocol_version = 3;
  string node_id = 4;
  repeated SourceDescriptor sources = 5;
  // Opaque identity for the daemon-wide monotonic clock epoch. Stable for
  // one daemon lifetime and changed when the daemon restarts.
  string clock_instance_id = 6;
}

message StartCapture {
  // Non-empty, no control characters, at most 256 UTF-8 bytes.
  string run_id = 1;
  // Unique ids drawn from HelloResponse.sources.
  repeated uint32 source_ids = 2;
  // Requested collection interval used by the implemented v0.1/v0.2 JSON
  // payload. The daemon may reject an invalid or unsupported interval.
  uint64 interval_ms = 3;

  // Tag 4 appeared as an unimplemented labels draft. Do not reuse it if the
  // transport later moves from JSON to protobuf payloads.
  reserved 4;
  reserved "labels";
}

message StopCapture {
  string run_id = 1;

  // Tag 2 appeared as an unimplemented reason draft. The implemented wire
  // request contains only the active run identity.
  reserved 2;
  reserved "reason";
}

message StartCaptureAck {
  string run_id = 1;
  repeated uint32 accepted_source_ids = 2;
}

message StopCaptureAck {
  string run_id = 1;
  uint64 batches_sent = 2;
  uint64 samples_sent = 3;
}

// Client request for a daemon-stamped benchmark marker. Node identity and
// monotonic time are intentionally absent: the daemon owns both values.
message RecordEvent {
  string run_id = 1;
  string event_id = 2;
  string kind = 3;
  map<string, string> labels = 4;
}

message RecordEventAck {
  Event event = 1;
}

message Error {
  uint32 code = 1;
  string message = 2;

  // Retryability is determined by the documented numeric code semantics; it
  // is not an implemented wire field.
  reserved 3;
  reserved "retryable";
}

message FramePayload {
  oneof payload {
    HelloRequest hello_request = 1;
    HelloResponse hello_response = 2;
    StartCapture start_capture = 3;
    StopCapture stop_capture = 4;
    StartCaptureAck start_capture_ack = 5;
    StopCaptureAck stop_capture_ack = 6;
    RecordEvent record_event = 7;
    RecordEventAck record_event_ack = 8;
    RawSampleBatch raw_sample_batch = 10;
    EventBatch event_batch = 11;
    Error error = 255;
  }
}
