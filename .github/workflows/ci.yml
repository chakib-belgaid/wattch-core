name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wattch-testd (so integration tests run instead of skipping)
        run: cargo build -p wattch-testd
      - name: Install Python package + test/build tooling
        run: pip install -e "clients/python[profiler]" pytest build twine
      - run: python -m pytest clients/python/tests
      - run: python -m build clients/python
      - run: twine check clients/python/dist/*

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode-energy-tests/package-lock.json
      - working-directory: editors/vscode-energy-tests
        run: npm ci
      - working-directory: editors/vscode-energy-tests
        run: npm test
