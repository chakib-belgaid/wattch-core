[workspace]
members = [
  "crates/wattch-core",
  "crates/wattch-protocol",
  "crates/wattch-daemon",
  "crates/wattch-testd",
  "crates/wattch-powerd",
  "crates/wattch-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
authors = ["Mohammed Chakib Belgaid"]
repository = "https://github.com/chakib-belgaid/wattch-core"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wattch-core = { path = "crates/wattch-core" }
wattch-protocol = { path = "crates/wattch-protocol" }
wattch-daemon = { path = "crates/wattch-daemon" }
